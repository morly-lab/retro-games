<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>パックマン風</title><style>
body{margin:0;overflow-x:hidden;background:#000;color:#fff;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
h1{color:#ff0;font-size:22px;margin:8px;text-shadow:3px 3px #f0f;letter-spacing:2px}
#hud{color:#0ff;margin:4px;font-size:16px;min-height:20px}
#wrap{position:relative}
canvas{display:block;background:#000;border:4px solid #33f;image-rendering:pixelated;max-width:94vw;max-height:62vh;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);text-align:center;padding:8px;box-sizing:border-box}
#msg{color:#ff0;font-size:20px;line-height:1.6}
button{font-family:inherit;font-size:18px;background:#111;color:#ff0;border:3px solid #f0f;padding:10px 14px;margin:3px;border-radius:0}
button:active{background:#f0f;color:#000}
.pad{display:flex;gap:4px;margin:6px;flex-wrap:wrap;justify-content:center}
.help{font-size:12px;color:#aaa;line-height:1.6}
a{color:#0f0;margin:6px}
html,body{touch-action:manipulation}
.ctl{width:min(96vw,480px);box-sizing:border-box;margin:8px;padding:10px;background:linear-gradient(#f3ead2,#ddd0ae);border-radius:16px;box-shadow:inset 0 2px 0 #fff8e6,inset 0 -4px 0 #b9aa84,0 5px 0 #8f8262,0 8px 12px rgba(0,0,0,.6);touch-action:manipulation}
.face{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#7e1a22;border-radius:8px;padding:12px clamp(5px,2vw,10px) 20px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.ctl button{margin:0;padding:0;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
.dpwrap{flex:none;background:#2a0d10;border-radius:14px;padding:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 #a33}
.dpad{display:grid;grid-template-columns:repeat(3,clamp(26px,8.5vw,42px));grid-template-rows:repeat(3,clamp(26px,8.5vw,42px));filter:drop-shadow(0 4px 0 #000)}
.dpad button,.dpad .c{background:linear-gradient(145deg,#4a4a4a,#111 55%,#000);color:#777;font-size:10px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.25)}
.dpad .u{grid-area:1/2;border-radius:4px 4px 0 0}.dpad .l{grid-area:2/1;border-radius:4px 0 0 4px}.dpad .r{grid-area:2/3;border-radius:0 4px 4px 0}.dpad .d{grid-area:3/2;border-radius:0 0 4px 4px}
.dpad .c{grid-area:2/2;display:flex;align-items:center;justify-content:center;background:#151515;box-shadow:none}.dpad .c::after{content:"";width:60%;height:60%;border-radius:50%;background:radial-gradient(circle at 60% 65%,#3a3a3a,#050505);box-shadow:inset 0 2px 3px #000}
.dpad button.on{background:linear-gradient(145deg,#222,#000);box-shadow:inset 2px 3px 4px #000;color:#555}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:4px;background:repeating-linear-gradient(#d9cfb4 0 5px,#7e1a22 5px 9px);box-shadow:inset 0 0 0 2px #7e1a22}
.mid .row{display:flex;gap:clamp(6px,2.5vw,14px);background:#d9cfb4;padding:3px 6px;border-radius:3px}
.mid .lbl span{width:clamp(28px,8.5vw,46px);text-align:center;font:bold clamp(7px,2.3vw,9px) sans-serif;color:#c4161c;letter-spacing:0}
.sm{width:clamp(28px,8.5vw,46px);height:13px;border-radius:7px;background:linear-gradient(#444,#111);box-shadow:0 3px 0 #000,inset 0 1px 0 #666}
.sm.on{transform:translateY(2px);box-shadow:0 1px 0 #000,inset 0 2px 3px #000}
#mute{font:bold 10px sans-serif;color:#7e1a22;background:#d9cfb4;padding:0 4px;border-radius:2px}
.abw{display:flex;flex-direction:column;align-items:center}
.ab{display:flex;gap:clamp(6px,2vw,10px)}
.well{width:clamp(42px,12.5vw,64px);height:clamp(42px,12.5vw,64px);display:flex;align-items:center;justify-content:center;background:linear-gradient(#bdb6a4,#8f8878);border-radius:6px;box-shadow:inset 0 3px 4px rgba(0,0,0,.55),0 1px 0 #c66}
.rb{width:78%;height:78%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff6a5c,#d71920 55%,#9a0c12);color:transparent;box-shadow:0 4px 0 #5e070b,0 5px 4px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.5)}
.rb.on{transform:translateY(3px);box-shadow:0 1px 0 #5e070b,inset 0 3px 5px rgba(0,0,0,.6)}
.abl{display:flex;gap:clamp(6px,2vw,10px);margin-top:3px}.abl span{width:clamp(42px,12.5vw,64px);text-align:right;font:bold 15px sans-serif;color:#d0181f;padding-right:4px;box-sizing:border-box}
.brand{position:absolute;right:12px;bottom:3px;font:italic bold 10px sans-serif;color:#d9cfb4;letter-spacing:3px;opacity:.85}
</style></head><body><h1>パックマン風</h1><div id="hud"></div><div id="wrap"><canvas id="c" width="380" height="440"></canvas><div id="ov"><p id="msg"></p><button id="go">スタート</button><p class="help">十字キー：移動　A：スタート　B：なし　START：一時停止　SELECT：BGM<br>キー：矢印・X/スペース(A)・Enter(START)・Shift/M(BGM)<br>スマホ：スワイプでも移動</p></div></div>
<div class="ctl"><div class="face"><div class="dpwrap"><div class="dpad"><button data-k="U" class="u" aria-label="上">▲</button><button data-k="L" class="l" aria-label="左">◀</button><div class="c"></div><button data-k="R" class="r" aria-label="右">▶</button><button data-k="D" class="d" aria-label="下">▼</button></div></div>
<div class="mid"><div class="row lbl"><span>SELECT</span><span>START</span></div><div class="row"><button data-k="SE" class="sm" aria-label="SELECT"></button><button data-k="ST" class="sm" aria-label="START"></button></div><span id="mute">♪ON</span></div>
<div class="abw"><div class="ab"><div class="well"><button data-k="B" class="rb" aria-label="B">B</button></div><div class="well"><button data-k="A" class="rb" aria-label="A">A</button></div></div><div class="abl"><span>B</span><span>A</span></div></div><div class="brand">RETRO</div></div></div>
<a href="index.html">← メニューへもどる</a>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),msgEl=document.getElementById('msg'),goB=document.getElementById('go');
const hud=t=>document.getElementById('hud').textContent=t;
const keys={};let running=false;
let paused=false;
function pauseToggle(){if(!running&&!paused){goB.click();return}if(paused){paused=false;ov.style.display='none';running=true;bgmStart()}else{paused=true;running=false;bgmStop();msgEl.innerHTML='一時停止';goB.textContent='つづける';ov.style.display='flex'}}
function showOv(m,b){paused=false;if(b==='リトライ'){bgmStop();sfx('die')}msgEl.innerHTML=m;goB.textContent=b;ov.style.display='flex';running=false}
goB.onclick=()=>{if(paused){pauseToggle();return}ov.style.display='none';for(const k in keys)keys[k]=0;ac();start();running=true;bgmStart()};

let AUD=null,bgmOn=localStorage.getItem('retroBgm')!=='0',bgmT=null,bgmStep=0,bgmNext=0;
const mb=document.getElementById('mute');const upd=()=>mb.textContent=bgmOn?'♪ON':'♪OFF';upd();
function ac(){if(!AUD){try{AUD=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AUD&&AUD.state==='suspended')AUD.resume();return AUD}
function tone(f,t,d,type,v){const a=AUD;if(!a||!f)return;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+0.02)}
const mf=n=>n?440*Math.pow(2,(n-69)/12):0;
function bgmStart(){if(!bgmOn||!ac()||typeof SONG==='undefined')return;bgmStop();bgmStep=0;bgmNext=AUD.currentTime+0.05;
bgmT=setInterval(()=>{const sp=60/SONG.bpm/2;while(bgmNext<AUD.currentTime+0.2){const i=bgmStep%SONG.m.length;tone(mf(SONG.m[i]),bgmNext,sp*0.9,'square',0.035);const b=SONG.b[i%SONG.b.length];tone(mf(b),bgmNext,sp*0.95,'triangle',0.07);bgmNext+=sp;bgmStep++}},50)}
function bgmStop(){if(bgmT){clearInterval(bgmT);bgmT=null}}
const SFX={eat:[[880,.05],[1320,.05]],hit:[[660,.04]],clear:[[523,.06],[659,.06],[784,.06],[1047,.1]],shot:[[1200,.03],[800,.04]],boom:[[160,.15]],die:[[400,.1],[300,.1],[200,.2]]};
let sfxLast=0;function sfx(n){if(!bgmOn||!AUD)return;const now=AUD.currentTime;if(n==='eat'&&now-sfxLast<0.07)return;sfxLast=now;let t=now;for(const[f,d]of SFX[n]){tone(f,t,d,n==='boom'?'sawtooth':'square',0.05);t+=d}}
function toggleBgm(){bgmOn=!bgmOn;localStorage.setItem('retroBgm',bgmOn?'1':'0');upd();if(bgmOn&&running)bgmStart();else bgmStop()}
mb.onclick=e=>{e.preventDefault();ac();toggleBgm()};
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')toggleBgm()});
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',' ':'A',x:'A',X:'A',z:'B',Z:'B',Enter:'ST',Shift:'SE'};
function btn(k){if(k==='ST'){pauseToggle();return}if(k==='SE'){ac();toggleBgm();return}if(!running){if(k==='A')goB.click();return}keys[k]=1;press(k)}
addEventListener('keydown',e=>{const k=KM[e.key];if(!k)return;e.preventDefault();if((k==='ST'||k==='SE')&&e.repeat)return;btn(k)});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
document.querySelectorAll('.ctl button').forEach(b=>{const k=b.dataset.k;let rt=null;
const dn=e=>{e.preventDefault();b.classList.add('on');btn(k);if('LRUD'.includes(k)){clearInterval(rt);rt=setTimeout(()=>{rt=setInterval(()=>{if(running)press(k)},110)},260)}};
const up=e=>{e.preventDefault();b.classList.remove('on');clearTimeout(rt);clearInterval(rt);rt=null;keys[k]=0};
b.addEventListener('touchstart',dn,{passive:false});b.addEventListener('mousedown',dn);b.addEventListener('touchend',up);b.addEventListener('touchcancel',up);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)});
document.addEventListener('dblclick',e=>e.preventDefault());
let ts0=null;const tx=t=>{const r=cv.getBoundingClientRect();return (t.clientX-r.left)*cv.width/r.width};
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];ts0={x:t.clientX,y:t.clientY};if(running&&typeof onTouchX==='function')onTouchX(tx(t))},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(running&&typeof onTouchX==='function')onTouchX(tx(e.touches[0]))},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!ts0||!running)return;const t=e.changedTouches[0],dx=t.clientX-ts0.x,dy=t.clientY-ts0.y;ts0=null;
if(Math.abs(dx)<15&&Math.abs(dy)<15)press('A');else if(typeof onTouchX!=='function'){press(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))}},{passive:false});
</script>
<script>
const SONG={bpm:150,m:[72,0,76,79,77,76,74,0,71,74,77,0,76,74,72,0,69,72,76,0,74,72,71,74,72,0,67,0,72,0,0,0],b:[48,55,48,55,53,60,53,60,50,57,50,57,48,55,43,55]};
const MAP=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.### # ###.####","   #.#   G   #.#   ","####.# ##-## #.####","    .  #GGG#  .    ","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o.#.....P.....#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#","#.................#","###################"];
const MW=19,MH=21,T=20,D={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
let dots,pac,gh,score,lives,lvl,fr,frN,dead,tm,lt=0,left;
const wall=(x,y,gst)=>{if(y<0||y>=MH)return true;x=(x+MW)%MW;const c=MAP[y][x];return c=='#'||(c=='-'&&!gst)};
function start(){score=0;lives=3;lvl=1;newLevel()}
function newLevel(){dots=MAP.map(r=>r.split('').map(c=>c=='.'?1:c=='o'?2:0));left=dots.flat().filter(v=>v).length;reset()}
function reset(){pac={x:9,y:15,px:9,py:15,d:[0,0],nd:[0,0],a:0,t:0};
gh=[[9,7,'#f33',0],[8,9,'#fbf',3],[9,9,'#0ff',6],[10,9,'#fb5',9]].map(([x,y,c,w],i)=>({x,y,px:x,py:y,c,i,d:[0,-1],t:0,wait:w*1000/lvl,eyes:0}));fr=0;tm=0;dead=0}
function press(k){if(D[k])pac.nd=D[k]}
function inHouse(o){return o.y>=8&&o.y<=9&&o.x>=8&&o.x<=10}
function stepPac(){pac.px=pac.x;pac.py=pac.y;const[nx,ny]=pac.nd;if(!wall(pac.x+nx,pac.y+ny))pac.d=pac.nd;const[dx,dy]=pac.d;
if(!wall(pac.x+dx,pac.y+dy)){pac.x=(pac.x+dx+MW)%MW;pac.y+=dy}const v=dots[pac.y][pac.x];
if(v){dots[pac.y][pac.x]=0;left--;score+=v==1?10:50;sfx('eat');if(v==2){fr=7000/Math.sqrt(lvl);frN=0;gh.forEach(o=>{if(!o.eyes)o.d=[-o.d[0],-o.d[1]]})}}}
function stepGhost(o){o.px=o.x;o.py=o.y;let tgt;
if(o.eyes){tgt=[9,9];if(o.x==9&&o.y==9){o.eyes=0}}else if(inHouse(o))tgt=[9,7];
else if(o.i==1)tgt=[pac.x+pac.d[0]*4,pac.y+pac.d[1]*4];else if(o.i==3&&Math.hypot(o.x-pac.x,o.y-pac.y)<6)tgt=[0,20];else tgt=[pac.x,pac.y];
const opts=Object.values(D).filter(([dx,dy])=>!(dx==-o.d[0]&&dy==-o.d[1])&&!wall(o.x+dx,o.y+dy,o.eyes||inHouse(o)||(o.y==8&&o.x==9)));
if(!opts.length)opts.push([-o.d[0],-o.d[1]]);let ch;
if(fr>0&&!o.eyes&&!inHouse(o)||(!o.eyes&&!inHouse(o)&&Math.random()<0.15))ch=opts[Math.random()*opts.length|0];
else ch=opts.reduce((b,d)=>{const s=Math.hypot(o.x+d[0]-tgt[0],o.y+d[1]-tgt[1]);return s<b[0]?[s,d]:b},[1e9,opts[0]])[1];
o.d=ch;o.x=(o.x+ch[0]+MW)%MW;o.y+=ch[1]}
function hit(){for(const o of gh){if(o.eyes||o.wait>0)continue;if((o.x==pac.x&&o.y==pac.y)||(o.x==pac.px&&o.y==pac.py&&o.px==pac.x&&o.py==pac.y)){
if(fr>0){o.eyes=1;frN++;sfx('clear');score+=200*Math.pow(2,frN-1)}else{dead=1500;lives--;sfx('boom');return}}}}
function loop(t){requestAnimationFrame(loop);let dt=Math.min(50,t-lt);lt=t;if(!running)return;
if(dead>0){dead-=dt;if(dead<=0){if(lives<=0){draw();showOv('ゲームオーバー<br>スコア '+score,'リトライ');return}reset()}draw();return}
if(fr>0)fr-=dt;const ps=Math.max(90,150-lvl*8);pac.t+=dt;if(pac.t>=ps){pac.t-=ps;stepPac();hit()}
for(const o of gh){if(o.wait>0){o.wait-=dt;continue}const s=o.eyes?70:fr>0?260:Math.max(110,175-lvl*10);o.t+=dt;if(o.t>=s){o.t-=s;stepGhost(o);hit()}}
if(left<=0){lvl++;newLevel()}pac.a+=dt;draw()}
function lerp(o,s){let f=Math.min(1,o.t/s);if(Math.abs(o.x-o.px)>1)f=1;return[(o.px+(o.x-o.px)*f)*T+T/2,(o.py+(o.y-o.py)*f)*T+T/2]}
function draw(){g.fillStyle='#000';g.fillRect(0,0,380,440);
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const c=MAP[y][x];if(c=='#'){g.fillStyle='#22d';g.fillRect(x*T+1,y*T+1,T-2,T-2);g.fillStyle='#000';g.fillRect(x*T+5,y*T+5,T-10,T-10)}else if(c=='-'){g.fillStyle='#fbf';g.fillRect(x*T,y*T+8,T,4)}
const v=dots[y][x];g.fillStyle='#fca';if(v==1)g.fillRect(x*T+8,y*T+8,4,4);if(v==2&&(lt/200|0)%2)g.fillRect(x*T+4,y*T+4,12,12)}
const ps=Math.max(90,150-lvl*8);const[cx,cy]=lerp(pac,ps);const ang=Math.atan2(pac.d[1],pac.d[0]);let m=dead>0?Math.min(3.1,(1500-dead)/400):Math.abs(Math.sin(pac.a/90))*0.8;
g.fillStyle='#ff0';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,9,ang+m/2,ang-m/2+Math.PI*2);g.fill();
if(!dead)gh.forEach(o=>{const s=o.eyes?70:fr>0?260:Math.max(110,175-lvl*10);const[x,y]=lerp(o,s);
if(!o.eyes){g.fillStyle=fr>0?(fr<2000&&(lt/150|0)%2?'#fff':'#22f'):o.c;g.beginPath();g.arc(x,y-1,9,Math.PI,0);g.lineTo(x+9,y+9);for(let i=0;i<4;i++)g.lineTo(x+9-i*6-3,y+(i%2?9:5));g.lineTo(x-9,y+9);g.fill()}
g.fillStyle='#fff';g.fillRect(x-6,y-5,5,6);g.fillRect(x+1,y-5,5,6);g.fillStyle='#00f';g.fillRect(x-5+o.d[0]*2,y-3+o.d[1]*2,3,3);g.fillRect(x+2+o.d[0]*2,y-3+o.d[1]*2,3,3)});
g.fillStyle='#ff0';for(let i=0;i<lives;i++){g.beginPath();g.moveTo(20+i*24,428);g.arc(20+i*24,428,8,0.6,5.7);g.fill()}
g.fillStyle='#fff';g.font='14px monospace';g.textAlign='right';g.fillText('ステージ '+lvl,370,432);hud('スコア '+score+'  のこり '+lives)}
showOv('パックマン風<br>ドットを全部食べよう！<br>大きいエサでゴーストを食べられるよ','スタート');requestAnimationFrame(loop);

</script></body></html>
