<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ブロック崩し</title><style>
body{margin:0;background:#000;color:#fff;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
h1{color:#ff0;font-size:22px;margin:8px;text-shadow:3px 3px #f0f;letter-spacing:2px}
#hud{color:#0ff;margin:4px;font-size:16px;min-height:20px}
#wrap{position:relative}
canvas{display:block;background:#000;border:4px solid #33f;image-rendering:pixelated;max-width:94vw;max-height:62vh;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);text-align:center;padding:8px;box-sizing:border-box}
#msg{color:#ff0;font-size:20px;line-height:1.6}
button{font-family:inherit;font-size:18px;background:#111;color:#ff0;border:3px solid #f0f;padding:10px 14px;margin:3px;border-radius:0}
button:active{background:#f0f;color:#000}
.pad{display:flex;gap:4px;margin:6px;flex-wrap:wrap;justify-content:center}
.help{font-size:12px;color:#aaa;line-height:1.6}
a{color:#0f0;margin:6px}
html,body{touch-action:manipulation}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#8b1e2e;border-radius:14px;padding:12px;margin:8px;width:min(94vw,460px);box-sizing:border-box;box-shadow:0 4px 0 #4a0f18;touch-action:manipulation}
.ctl button{margin:0;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);background:#bbb;border-radius:10px;padding:6px}
.dpad button,.dpad .c{background:#222;color:#666;font-size:14px;padding:0;box-shadow:0 4px 0 #000}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}.dpad .c{grid-area:2/2;box-shadow:0 4px 0 #000}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.mid{background:#bbb;border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mid .row{display:flex;gap:8px}.mid label{font-size:10px;color:#8b1e2e;font-weight:bold;text-align:center}
.sm{width:44px;height:14px;border-radius:7px!important;background:#333;box-shadow:0 3px 0 #000}
#mute{font-size:11px;color:#222}
.ab{display:flex;gap:10px;background:#bbb;border-radius:10px;padding:8px 8px 4px}
.ab div{display:flex;flex-direction:column;align-items:center}.ab label{color:#8b1e2e;font-weight:bold;font-size:14px}
.rb{width:56px;height:56px;border-radius:50%!important;background:#e01e2e;color:#fff;font-size:16px;font-weight:bold;box-shadow:0 4px 0 #6a0a12}
.ctl button.on{transform:translateY(3px);box-shadow:0 1px 0 #000!important;filter:brightness(1.3)}
@media(max-width:400px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.rb{width:50px;height:50px}}

</style></head><body><h1>ブロック崩し</h1><div id="hud"></div><div id="wrap"><canvas id="c" width="360" height="480"></canvas><div id="ov"><p id="msg"></p><button id="go">スタート</button><p class="help">十字キー←→：移動　A：発射　B：なし　START：一時停止　SELECT：BGM<br>キー：矢印・X/スペース(A)・Enter・Shift/M<br>スマホ：画面をなぞって移動・タップで発射</p></div></div>
<div class="ctl"><div class="dpad"><button data-k="U" class="u">▲</button><button data-k="L" class="l">◀</button><div class="c"></div><button data-k="R" class="r">▶</button><button data-k="D" class="d">▼</button></div>
<div class="mid"><span id="mute">♪ON</span><div class="row"><div><button data-k="SE" class="sm"></button><label>SELECT</label></div><div><button data-k="ST" class="sm"></button><label>START</label></div></div></div>
<div class="ab"><div><button data-k="B" class="rb">B</button><label>B</label></div><div><button data-k="A" class="rb">A</button><label>A</label></div></div></div><a href="index.html">← メニューへもどる</a>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),msgEl=document.getElementById('msg'),goB=document.getElementById('go');
const hud=t=>document.getElementById('hud').textContent=t;
const keys={};let running=false;
let paused=false;
function pauseToggle(){if(!running&&!paused){goB.click();return}if(paused){paused=false;ov.style.display='none';running=true;bgmStart()}else{paused=true;running=false;bgmStop();msgEl.innerHTML='一時停止';goB.textContent='つづける';ov.style.display='flex'}}
function showOv(m,b){paused=false;if(b==='リトライ'){bgmStop();sfx('die')}msgEl.innerHTML=m;goB.textContent=b;ov.style.display='flex';running=false}
goB.onclick=()=>{if(paused){pauseToggle();return}ov.style.display='none';for(const k in keys)keys[k]=0;ac();start();running=true;bgmStart()};

let AUD=null,bgmOn=localStorage.getItem('retroBgm')!=='0',bgmT=null,bgmStep=0,bgmNext=0;
const mb=document.getElementById('mute');const upd=()=>mb.textContent=bgmOn?'♪ON':'♪OFF';upd();
function ac(){if(!AUD){try{AUD=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AUD&&AUD.state==='suspended')AUD.resume();return AUD}
function tone(f,t,d,type,v){const a=AUD;if(!a||!f)return;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+0.02)}
const mf=n=>n?440*Math.pow(2,(n-69)/12):0;
function bgmStart(){if(!bgmOn||!ac()||typeof SONG==='undefined')return;bgmStop();bgmStep=0;bgmNext=AUD.currentTime+0.05;
bgmT=setInterval(()=>{const sp=60/SONG.bpm/2;while(bgmNext<AUD.currentTime+0.2){const i=bgmStep%SONG.m.length;tone(mf(SONG.m[i]),bgmNext,sp*0.9,'square',0.035);const b=SONG.b[i%SONG.b.length];tone(mf(b),bgmNext,sp*0.95,'triangle',0.07);bgmNext+=sp;bgmStep++}},50)}
function bgmStop(){if(bgmT){clearInterval(bgmT);bgmT=null}}
const SFX={eat:[[880,.05],[1320,.05]],hit:[[660,.04]],clear:[[523,.06],[659,.06],[784,.06],[1047,.1]],shot:[[1200,.03],[800,.04]],boom:[[160,.15]],die:[[400,.1],[300,.1],[200,.2]]};
let sfxLast=0;function sfx(n){if(!bgmOn||!AUD)return;const now=AUD.currentTime;if(n==='eat'&&now-sfxLast<0.07)return;sfxLast=now;let t=now;for(const[f,d]of SFX[n]){tone(f,t,d,n==='boom'?'sawtooth':'square',0.05);t+=d}}
function toggleBgm(){bgmOn=!bgmOn;localStorage.setItem('retroBgm',bgmOn?'1':'0');upd();if(bgmOn&&running)bgmStart();else bgmStop()}
mb.onclick=e=>{e.preventDefault();ac();toggleBgm()};
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')toggleBgm()});
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',' ':'A',x:'A',X:'A',z:'B',Z:'B',Enter:'ST',Shift:'SE'};
function btn(k){if(k==='ST'){pauseToggle();return}if(k==='SE'){ac();toggleBgm();return}if(!running){if(k==='A')goB.click();return}keys[k]=1;press(k)}
addEventListener('keydown',e=>{const k=KM[e.key];if(!k)return;e.preventDefault();if((k==='ST'||k==='SE')&&e.repeat)return;btn(k)});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
document.querySelectorAll('.ctl button').forEach(b=>{const k=b.dataset.k;let rt=null;
const dn=e=>{e.preventDefault();b.classList.add('on');btn(k);if('LRUD'.includes(k)){clearInterval(rt);rt=setTimeout(()=>{rt=setInterval(()=>{if(running)press(k)},110)},260)}};
const up=e=>{e.preventDefault();b.classList.remove('on');clearTimeout(rt);clearInterval(rt);rt=null;keys[k]=0};
b.addEventListener('touchstart',dn,{passive:false});b.addEventListener('mousedown',dn);b.addEventListener('touchend',up);b.addEventListener('touchcancel',up);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)});
document.addEventListener('dblclick',e=>e.preventDefault());
let ts0=null;const tx=t=>{const r=cv.getBoundingClientRect();return (t.clientX-r.left)*cv.width/r.width};
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];ts0={x:t.clientX,y:t.clientY};if(running&&typeof onTouchX==='function')onTouchX(tx(t))},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(running&&typeof onTouchX==='function')onTouchX(tx(e.touches[0]))},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!ts0||!running)return;const t=e.changedTouches[0],dx=t.clientX-ts0.x,dy=t.clientY-ts0.y;ts0=null;
if(Math.abs(dx)<15&&Math.abs(dy)<15)press('A');else if(typeof onTouchX!=='function'){press(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))}},{passive:false});
</script>
<script>
const SONG={bpm:160,m:[64,64,67,0,69,67,64,0,62,62,66,0,67,66,62,0,60,64,67,72,71,67,64,0,62,66,69,74,72,0,0,0],b:[40,47,40,47,38,45,38,45,36,43,36,43,38,45,43,47]};
let px,bx,by,vx,vy,br,score,lives,stuck,lv;
function start(){score=0;lives=3;lv=1;mk();reset()}
function mk(){br=[];const cols=['#f33','#f93','#ff3','#3f3','#3cf','#c3f'];for(let r=0;r<6;r++)for(let c=0;c<8;c++)br.push({x:4+c*44,y:50+r*18,c:cols[r],a:1})}
function reset(){px=150;stuck=1}
function press(k){if(k=='A'&&stuck){stuck=0;vx=(Math.random()-.5)*4;vy=-(3.5+lv*.5)}}
function onTouchX(x){px=x-30;if(stuck&&false)press('A')}
function loop(){requestAnimationFrame(loop);if(!running)return;if(keys.L)px-=6;if(keys.R)px+=6;px=Math.max(0,Math.min(300,px));
if(stuck){bx=px+30;by=443}else{bx+=vx;by+=vy;if(bx<5||bx>355){vx=-vx;bx=Math.max(5,Math.min(355,bx))}if(by<5){vy=-vy;by=5}
if(vy>0&&by>444&&by<458&&bx>px-5&&bx<px+65){vy=-Math.abs(vy);sfx('shot');vx=((bx-px-30)/30)*4.5}
for(const b of br)if(b.a&&bx>b.x-4&&bx<b.x+44&&by>b.y-4&&by<b.y+18){b.a=0;vy=-vy;sfx('hit');score+=10*lv;break}
if(by>490){lives--;if(lives<=0){draw();showOv('ゲームオーバー<br>スコア '+score,'リトライ');return}reset()}
if(br.every(b=>!b.a)){lv++;mk();reset()}}draw()}
function draw(){g.fillStyle='#000';g.fillRect(0,0,360,480);br.forEach(b=>{if(!b.a)return;g.fillStyle=b.c;g.fillRect(b.x,b.y,40,14);g.fillStyle='rgba(255,255,255,.4)';g.fillRect(b.x,b.y,40,3)});
g.fillStyle='#0ff';g.fillRect(px,450,60,10);g.fillStyle='#fff';g.fillRect(bx-5,by-5,10,10);
if(stuck){g.fillStyle='#ff0';g.font='16px monospace';g.textAlign='center';g.fillText('スペース / タップで発射',180,330)}
hud('スコア '+score+'  のこり '+'♥'.repeat(lives)+'  ステージ '+lv)}
showOv('ブロック崩し<br>ボールを打ち返して<br>ブロックを全部こわそう','スタート');requestAnimationFrame(loop);

</script></body></html>
