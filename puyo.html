<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ぷよぷよ風</title><style>
body{margin:0;background:#000;color:#fff;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
h1{color:#ff0;font-size:22px;margin:8px;text-shadow:3px 3px #f0f;letter-spacing:2px}
#hud{color:#0ff;margin:4px;font-size:16px;min-height:20px}
#wrap{position:relative}
canvas{display:block;background:#000;border:4px solid #33f;image-rendering:pixelated;max-width:94vw;max-height:62vh;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);text-align:center;padding:8px;box-sizing:border-box}
#msg{color:#ff0;font-size:20px;line-height:1.6}
button{font-family:inherit;font-size:18px;background:#111;color:#ff0;border:3px solid #f0f;padding:10px 14px;margin:3px;border-radius:0}
button:active{background:#f0f;color:#000}
.pad{display:flex;gap:4px;margin:6px;flex-wrap:wrap;justify-content:center}
.help{font-size:12px;color:#aaa;line-height:1.6}
a{color:#0f0;margin:6px}
</style></head><body><h1>ぷよぷよ風</h1><div id="hud"></div><div id="wrap"><canvas id="c" width="300" height="384"></canvas><div id="ov"><p id="msg"></p><button id="go">スタート</button><p class="help">←→ 移動　↑・スペース 右回転　Z 左回転　↓ はやく落とす<br>スマホ：ボタン・スワイプ・タップ(回転)</p></div></div>
<div class="pad"><button data-k="L">←</button><button data-k="B">↺</button><button data-k="A">↻</button><button data-k="D">↓</button><button data-k="R">→</button></div><button id="mute" style="font-size:14px;padding:6px 10px">♪ON</button><a href="index.html">← メニューへもどる</a>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),msgEl=document.getElementById('msg'),goB=document.getElementById('go');
const hud=t=>document.getElementById('hud').textContent=t;
const keys={};let running=false;
function showOv(m,b){if(b==='リトライ'){bgmStop();sfx('die')}msgEl.innerHTML=m;goB.textContent=b;ov.style.display='flex';running=false}
goB.onclick=()=>{ov.style.display='none';for(const k in keys)keys[k]=0;ac();start();running=true;bgmStart()};

let AUD=null,bgmOn=localStorage.getItem('retroBgm')!=='0',bgmT=null,bgmStep=0,bgmNext=0;
const mb=document.getElementById('mute');const upd=()=>mb.textContent=bgmOn?'♪ON':'♪OFF';upd();
function ac(){if(!AUD){try{AUD=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AUD&&AUD.state==='suspended')AUD.resume();return AUD}
function tone(f,t,d,type,v){const a=AUD;if(!a||!f)return;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+0.02)}
const mf=n=>n?440*Math.pow(2,(n-69)/12):0;
function bgmStart(){if(!bgmOn||!ac()||typeof SONG==='undefined')return;bgmStop();bgmStep=0;bgmNext=AUD.currentTime+0.05;
bgmT=setInterval(()=>{const sp=60/SONG.bpm/2;while(bgmNext<AUD.currentTime+0.2){const i=bgmStep%SONG.m.length;tone(mf(SONG.m[i]),bgmNext,sp*0.9,'square',0.035);const b=SONG.b[i%SONG.b.length];tone(mf(b),bgmNext,sp*0.95,'triangle',0.07);bgmNext+=sp;bgmStep++}},50)}
function bgmStop(){if(bgmT){clearInterval(bgmT);bgmT=null}}
const SFX={eat:[[880,.05],[1320,.05]],hit:[[660,.04]],clear:[[523,.06],[659,.06],[784,.06],[1047,.1]],shot:[[1200,.03],[800,.04]],boom:[[160,.15]],die:[[400,.1],[300,.1],[200,.2]]};
let sfxLast=0;function sfx(n){if(!bgmOn||!AUD)return;const now=AUD.currentTime;if(n==='eat'&&now-sfxLast<0.07)return;sfxLast=now;let t=now;for(const[f,d]of SFX[n]){tone(f,t,d,n==='boom'?'sawtooth':'square',0.05);t+=d}}
function toggleBgm(){bgmOn=!bgmOn;localStorage.setItem('retroBgm',bgmOn?'1':'0');upd();if(bgmOn&&running)bgmStart();else bgmStop()}
mb.onclick=e=>{e.preventDefault();ac();toggleBgm();mb.blur()};
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')toggleBgm()});
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',' ':'A',x:'A',X:'A',z:'B',Z:'B',Enter:'S'};
addEventListener('keydown',e=>{const k=KM[e.key];if(!k)return;e.preventDefault();if(!running){if(k==='S'||k==='A')goB.click();return}keys[k]=1;press(k)});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
const dn=e=>{e.preventDefault();if(!running){goB.click();return}keys[k]=1;press(k)};const up=e=>{e.preventDefault();keys[k]=0};
b.addEventListener('touchstart',dn,{passive:false});b.addEventListener('mousedown',dn);b.addEventListener('touchend',up);b.addEventListener('touchcancel',up);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)});
let ts0=null;const tx=t=>{const r=cv.getBoundingClientRect();return (t.clientX-r.left)*cv.width/r.width};
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];ts0={x:t.clientX,y:t.clientY};if(running&&typeof onTouchX==='function')onTouchX(tx(t))},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(running&&typeof onTouchX==='function')onTouchX(tx(e.touches[0]))},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!ts0||!running)return;const t=e.changedTouches[0],dx=t.clientX-ts0.x,dy=t.clientY-ts0.y;ts0=null;
if(Math.abs(dx)<15&&Math.abs(dy)<15)press('A');else if(typeof onTouchX!=='function'){press(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))}},{passive:false});
</script>
<script>
const SONG={bpm:132,m:[67,69,71,74,0,71,72,74,76,0,74,72,71,69,67,0,64,67,69,72,0,69,71,72,74,72,71,69,67,0,0,0],b:[43,50,47,50,48,55,52,55,45,52,48,52,43,50,47,50]};
const W=6,H=12,S=32,COL=['#f33','#3f3','#39f','#ff3'];
let bd,pr,nx,score,chain,state,acc,lt=0,ctxt='',ct=0,maxc;
const OFF=[[0,-1],[1,0],[0,1],[-1,0]];
function np(){return{x:2,y:0,r:0,a:Math.random()*4|0,b:Math.random()*4|0}}
function cells(p){return[[p.x,p.y,p.a],[p.x+OFF[p.r][0],p.y+OFF[p.r][1],p.b]]}
function ok(p){return cells(p).every(([x,y])=>x>=0&&x<W&&y<H&&(y<0||bd[y][x]<0))}
function start(){bd=Array.from({length:H},()=>Array(W).fill(-1));score=0;chain=0;maxc=0;nx=np();spawn();acc=0;draw()}
function spawn(){pr=nx;nx=np();state='fall';if(!ok(pr)||bd[0][2]>=0){draw();showOv('ゲームオーバー<br>スコア '+score+'<br>最大 '+maxc+' れんさ','リトライ')}}
function mv(dx,dy,dr=0){const p={...pr,x:pr.x+dx,y:pr.y+dy,r:(pr.r+dr+4)%4};if(ok(p)){pr=p;return true}return false}
function press(k){if(!running||state!='fall')return;if(k=='L')mv(-1,0);if(k=='R')mv(1,0);if(k=='D'){if(!mv(0,1))place();acc=0}
if(k=='U'||k=='A'||k=='B'){const d=k=='B'?-1:1;const r=(pr.r+d+4)%4;if(!mv(0,0,d)){const o=OFF[r];if(!mv(-o[0],-o[1],d)){mv(0,0,d*2)}}}draw()}
function place(){cells(pr).forEach(([x,y,c])=>{if(y>=0)bd[y][x]=c});state='res';acc=0;chain=0}
function grav(){for(let x=0;x<W;x++){let w=H-1;for(let y=H-1;y>=0;y--)if(bd[y][x]>=0){const c=bd[y][x];bd[y][x]=-1;bd[w--][x]=c}}}
function groups(){const seen=bd.map(r=>r.map(()=>0)),out=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(bd[y][x]<0||seen[y][x])continue;const c=bd[y][x],st=[[x,y]],gp=[];seen[y][x]=1;
while(st.length){const[cx,cy]=st.pop();gp.push([cx,cy]);for(const[dx,dy]of OFF){const nx2=cx+dx,ny=cy+dy;if(nx2>=0&&nx2<W&&ny>=0&&ny<H&&!seen[ny][nx2]&&bd[ny][nx2]==c){seen[ny][nx2]=1;st.push([nx2,ny])}}}
if(gp.length>=4)out.push(gp)}return out}
function resolve(){grav();const gs=groups();if(gs.length){chain++;maxc=Math.max(maxc,chain);let n=0;gs.forEach(gp=>gp.forEach(([x,y])=>{bd[y][x]=-1;n++}));score+=n*10*Math.pow(2,chain-1);sfx('clear');if(chain>=1){ctxt=chain+' れんさ！';ct=60}}else spawn()}
function loop(t){requestAnimationFrame(loop);const dt=t-lt;lt=t;if(!running)return;acc+=dt;
if(state=='fall'){if(acc>Math.max(150,600-score/100)||(keys.D&&acc>50)){acc=0;if(!mv(0,1))place()}}else if(acc>350){acc=0;resolve()}if(running)draw()}
function puyo(x,y,c,s=S){const r=s/2;g.fillStyle=COL[c];g.beginPath();g.arc(x+r,y+r,r-2,0,7);g.fill();g.fillStyle='#fff';g.fillRect(x+r-7,y+r-5,5,6);g.fillRect(x+r+2,y+r-5,5,6);g.fillStyle='#000';g.fillRect(x+r-5,y+r-3,3,4);g.fillRect(x+r+4,y+r-3,3,4)}
function draw(){g.fillStyle='#000';g.fillRect(0,0,300,384);g.fillStyle='#200';g.fillRect(2*S,0,S,S);
bd.forEach((r,y)=>r.forEach((c,x)=>c>=0&&puyo(x*S,y*S,c)));if(state=='fall')cells(pr).forEach(([x,y,c])=>y>=0&&puyo(x*S,y*S,c));
g.fillStyle='#33f';g.fillRect(192,0,4,384);g.fillStyle='#ff0';g.font='16px monospace';g.textAlign='left';g.fillText('つぎ',210,26);puyo(220,70,nx.a,26);puyo(220,40,nx.b,26);
g.fillStyle='#0ff';g.fillText('スコア',206,140);g.fillStyle='#fff';g.fillText(score,206,162);
if(ct>0){ct--;g.fillStyle=ct%10<5?'#ff0':'#f6f';g.font='bold 24px monospace';g.textAlign='center';g.fillText(ctxt,96,180)}
hud('スコア '+score+'  最大 '+maxc+' れんさ')}
showOv('ぷよぷよ風<br>同じ色を4つつなげて消そう<br>れんさでハイスコア！','スタート');requestAnimationFrame(loop);

</script></body></html>
